<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jet 1 – Unit 3</title>
<style>
:root{--bg:#fff7e0;--ink:#1d2b4f;--card:#fff;--main:#2f6df6;--ok:#1fa968;--bad:#e5484d;--sun:#e0a100;--mute:#5d6a8a}
@media(prefers-color-scheme:dark){:root{--bg:#121a33;--ink:#f3f5ff;--card:#1d2850;--mute:#a6b1d6}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,Heebo,Arial,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:560px;padding:20px;min-height:100vh;display:flex;flex-direction:column;gap:10px;text-align:center}
button{font:inherit;font-weight:700;border:0;border-radius:16px;padding:14px;font-size:18px;color:#fff;background:var(--main);box-shadow:0 4px 0 rgba(0,0,0,.25);cursor:pointer;text-transform:none}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
button:focus-visible{outline:3px solid var(--ink)}
.alt{background:var(--sun)}.gr{background:var(--ok)}.pu{background:#7b4fe0}.mu{background:var(--mute)}.hm{background:#888}.mic{background:var(--bad);font-size:36px;width:90px;height:90px;border-radius:50%;margin:6px auto}
.mic.on{animation:p 1s infinite}@keyframes p{50%{transform:scale(1.1)}}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
h1{margin:4px 0}.sm{color:var(--mute);font-size:15px}.red{color:var(--bad);font-weight:700}
.w{font-size:54px;font-weight:800;direction:ltr}.big{font-size:30px;font-weight:800;direction:ltr}
.msg{min-height:26px;font-weight:700;font-size:19px}.ok{color:var(--ok)}.bad{color:var(--bad)}
.grid{display:grid;gap:10px}.opt{font-size:40px;min-height:90px;font-family:monospace}.opt.e{font-size:48px}
ul{list-style:none;padding:0;margin:8px 0;text-align:right;max-height:230px;overflow:auto}li{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px solid #8884}
.stars{font-size:36px}.score{font-size:72px;font-weight:800}
</style></head><body><div id="app"></div>
<script>
const W=[["bag","תיק"],["banana","בננה"],["Dad","אבא"],["bad","רע"],["egg","ביצה"],["bed","מיטה"],["sad","עצוב"],["hat","כובע"],["test","מבחן"],["pen","עט"],["hen","תרנגול"],["hand","יד"],["help","לעזור"],["big","גדול"],["stop","לעצור"],["hot","חם"],["cold","קר"],["lost","אבד"],["dog","כלב"],["job","עבודה"],["plan","תוכנית"],["pet","חיית מחמד"],["leg","רגל"],["grandpa","סבא"],["lamp","מנורה"],["mat","שטיחון"],["sing","לשיר"],["ten","עשר"],["mad","כועס"],["glad","שמח"],["cat","חתול"],["on","על"],["in","בתוך"],["add","להוסיף"],["mom","אמא"],["lemon","לימון"],["melon","מלון"],["grandma","סבתא"],["and","ו (מילת חיבור)"],["panda","פנדה"]];
const SIGHT=[["Look","תסתכלו"],["I am","אני"],["have","יש לי"],["has","יש לו / לה"],["the","ה (היידוע)"],["like","אוהב"],["he","הוא"],["she","היא"]];
const LET=["Aa","Bb","Nn","Dd","Gg","Ee","Tt","Ii","Pp","Hh","Ss","Mm","Cc","Oo","Ll","Jj"];
const ITEMS=[["cat","🐱"],["dog","🐶"],["hen","🐔"],["panda","🐼"],["hat","👒"],["bag","🎒"],["pen","🖊️"],["bed","🛏️"],["egg","🥚"],["banana","🍌"],["lemon","🍋"],["melon","🍈"]];
const AL={bag:"bags bague",banana:"bananas",dad:"dads daddy dat",bad:"bads bat",egg:"eggs eg ag ecg",bed:"bet bedd beds",sad:"sat said sed",hat:"hats had hut at at hurt",test:"tests text tast",pen:"pens penn pan",hen:"hens when then ben en een",hand:"hands han and an handed",help:"helps helped elp kelp yelp held hell",big:"bick bigg",stop:"stops stopp",hot:"hut hots ot hott what",cold:"called coal colt",lost:"lust last",dog:"dogs doug dug",job:"jobs jab jog",plan:"plans plant plane",pet:"pets pat bet pit",leg:"legs lag lek",grandpa:"grandpas grampa gramps grandfather",lamp:"lamps lamb ramp",mat:"mats matt mutt met",sing:"sings sink singh",ten:"then tin tan",mad:"made mud med",glad:"clad glade gland",cat:"cats kat cut cap",on:"own un ahn",in:"inn n",add:"ad adds",mom:"mum mama mommy mam",lemon:"lemons lemmon",melon:"melons mellon malone",grandma:"grandmas gramma grandmother",and:"an n end ann ant",panda:"pandas pander",look:"looks luck lock","i am":"iam im am",have:"half halve ave av",has:"as haz hass az hz his",the:"thee da duh thuh tha de",like:"likes liked lyke",he:"hey hee hi e ee who",she:"shea shi"};
const $=s=>document.querySelector(s),acts=[];
let cfg={v:"",r:.8,p:1};try{Object.assign(cfg,JSON.parse(localStorage.getItem("jet1cfg")||"{}"))}catch(e){}
const sv=()=>{try{localStorage.setItem("jet1cfg",JSON.stringify(cfg))}catch(e){}},voices=()=>speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let sid=0,fin=false,rec=null,tries=0,auto=0,L=[],i=0,score=0,res=[],silent=false,quiz=false,Q=[];
const sh=a=>[...a].sort(()=>Math.random()-.5);
function B(t,c,f){acts.push(f);return `<button class="${c||''}" onclick="acts[${acts.length-1}]()">${t}</button>`}
function show(h,back=true){try{rec&&rec.abort()}catch(e){}$("#app").innerHTML=h+(back?B("🏠 תפריט ראשי","hm",home):"")}
function home(){sid++;fin=true;try{rec&&rec.abort()}catch(e){}speechSynthesis.cancel();menu()}
function speak(t,cb){let d=false;const f=()=>{if(!d){d=true;cb&&cb()}};try{speechSynthesis.cancel();setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=cfg.r;u.pitch=cfg.p;const V=voices(),v=V.find(x=>x.name==cfg.v)||V.find(x=>/en[-_]US/i.test(x.lang))||V[0];if(v)u.voice=v;u.onend=f;u.onerror=f;speechSynthesis.resume();speechSynthesis.speak(u);setTimeout(f,4500)},120)}catch(e){f()}}
function msg(t,c){const m=$("#msg");if(m){m.textContent=t;m.className="msg "+(c||"")}}
/* ---------- matching ---------- */
const norm=s=>s.toLowerCase().replace(/&/g," and ").replace(/10/g,"ten").replace(/[^a-z ]/g,"").trim(),key=s=>norm(s).replace(/ /g,"");
function lev(a,b){let p=[...Array(b.length+1).keys()];for(let x=1;x<=a.length;x++){const c=[x];for(let y=1;y<=b.length;y++)c[y]=Math.min(p[y]+1,c[y-1]+1,p[y-1]+(a[x-1]==b[y-1]?0:1));p=c}return p[b.length]}
function match(alts){const w=L[i][0].toLowerCase(),ok=new Set([key(w),...(w[0]=="h"?[key(w).slice(1)]:[]),...(AL[w]||"").split(" ").filter(Boolean).map(key)]);
 return alts.some(h=>[...h.split(" "),h].some(p=>{const k=key(p);return k&&(ok.has(k)||(w.length>=5&&lev(k,key(w))<=1))}))}
/* ---------- menu ---------- */
function menu(){const d=Math.ceil((new Date(2026,9,15)-new Date())/864e5);
 const c=d>1?`📅 המבחן ביום חמישי 15/10/26 – עוד ${d} ימים`:d==1?"📅 המבחן מחר! בהצלחה":d==0?"📅 המבחן היום! בהצלחה":"";
 show(`<h1>Jet 1 – Unit 3</h1><div class="red">${c}</div><div>תרגלתי, ידעתי! 💪</div>`+
 B("🔤 האותיות – גדולה וקטנה","",letters)+B("👀 מילים נפוצות: Look, I am, have…","pu",()=>words(sh(SIGHT)))+
 B("🖼️ התאמת משפט לתמונה","gr",()=>startQ(sentQ()))+B("📖 קריאה: רואים מילה ואומרים","alt",()=>words(sh(W).slice(0,10),true))+
 B("🎧 שמעו וחזרו – 10 מילים","",()=>words(sh(W).slice(0,10)))+B("🎧 שמעו וחזרו – כל 40 המילים","mu",()=>words(sh(W)))+B("⚙️ בחירת קול","mu",settings),false)}
function welcome(){const h="Hello Avishag! Welcome! Let's practice English.";
 show(`<div style="font-size:80px">👋</div><div class="big" style="font-size:40px">Hello, Avishag!</div><div class="big" style="font-size:22px;font-weight:400">Welcome to your English practice!</div><div>שלום אבישג! ברוכה הבאה לתרגול באנגלית 🌟</div>`+
 B("🔊 Hello Avishag","mu",()=>speak(h))+B("Let's start! בואו נתחיל 🚀","gr",menu),false);
 speak(h)}
/* ---------- voice settings ---------- */
function settings(){const t="Hello Avishag! Let's practice English.",V=voices();
 const pill=(l,k,val)=>B((cfg[k]==val?"✔ ":"")+l,cfg[k]==val?"gr":"mu",()=>{cfg[k]=val;sv();settings();speak(t)});
 show(`<h1>⚙️ בחירת קול</h1><div class="sm">בחרו קול שהכי נעים לשמוע. קולות עם Natural ו-Online נשמעים הכי טוב.</div>`+
 `<select id="vs" style="font-size:18px;padding:12px;border-radius:12px" dir="ltr" onchange="cfg.v=this.value;sv();speak('${t.replace(/'/g,"\\'")}')">`+
 (V.length?V.map(v=>`<option value="${v.name}" ${v.name==cfg.v?"selected":""}>${v.name} (${v.lang})</option>`).join(""):"<option>לא נמצאו קולות באנגלית</option>")+`</select>`+
 B("🔊 שמעו דוגמה","",()=>speak(t))+`<div class="sm">מהירות</div><div class="grid" style="grid-template-columns:repeat(3,1fr)">${pill("🐢 איטי","r",.6)}${pill("רגיל","r",.8)}${pill("🐇 מהיר","r",1)}</div>`+
 `<div class="sm">גובה הקול</div><div class="grid" style="grid-template-columns:repeat(3,1fr)">${pill("נמוך","p",.8)}${pill("רגיל","p",1)}${pill("🧒 גבוה","p",1.4)}</div>`)}
speechSynthesis.onvoiceschanged=()=>{if($("#vs"))settings()};
/* ---------- say-and-repeat words ---------- */
function words(list,s){L=list;i=0;score=0;res=[];silent=!!s;quiz=false;sid++;loadW()}
function loadW(){const[w,h]=L[i];tries=0;auto=0;fin=false;
 show(`<div class="sm" style="font-weight:700;font-size:18px">${i+1}/${L.length} &nbsp; ⭐ ${score}</div><div class="card"><div class="w">${w}</div><div class="sm" style="font-size:24px">${h}</div>`+
 B("🔊 שמעו שוב","mu",()=>speak(w))+`<button class="mic" id="mic" onclick="auto=0;listen()" aria-label="דברו">🎤</button><div class="msg" id="msg"></div><div class="sm" id="heard" dir="ltr"></div>${SR?"":B("אמרתי נכון ✓","gr",()=>endW(true))}</div>`+B("דלגו על המילה","mu",()=>{try{rec&&rec.abort()}catch(e){}endW(false)}));
 if(silent)msg("קראו את המילה בקול – לחצו על 🎤");else{msg("הקשיבו…");speak(w,()=>msg("עכשיו אתם! לחצו על 🎤"))}}
function listen(){if(fin)return;if(!SR){msg("הדפדפן לא תומך בזיהוי קול – השתמשו ב-Chrome או Edge","bad");return}
 speechSynthesis.cancel();try{rec&&rec.abort()}catch(e){}const my=sid;rec=new SR();rec.lang="en-US";rec.maxAlternatives=5;rec.interimResults=true;
 const mic=$("#mic");mic&&mic.classList.add("on");msg("מקשיב…");let done=false;
 rec.onresult=e=>{if(my!=sid||fin)return;const r=e.results[e.results.length-1],alts=[...r].map(a=>norm(a.transcript));$("#heard").textContent="שמענו: "+alts[0];
  if(match(alts)){done=true;rec.abort();endW(true)}else if(r.isFinal){done=true;tries++;if(tries>=2)endW(false);else msg("כמעט! נסו שוב 🎤","bad")}};
 rec.onerror=e=>{if(my!=sid||fin||done)return;if(e.error=="not-allowed"||e.error=="service-not-allowed"){msg("צריך לאשר גישה למיקרופון בדפדפן","bad");done=true}else if((e.error=="no-speech")&&auto<2){auto++;done=true;setTimeout(()=>{if(!fin&&my==sid)listen()},300)}};
 rec.onend=()=>{mic&&mic.classList.remove("on");if(my!=sid||fin||done)return;if(auto<2){auto++;setTimeout(()=>{if(!fin&&my==sid)listen()},300)}else msg("לא שמענו. נסו שוב 🎤","bad")};
 try{rec.start()}catch(e){}}
function endW(ok){if(fin)return;fin=true;const[w,h]=L[i];res.push([w,h,ok]);if(ok){score++;msg("כל הכבוד! ✓","ok")}else{msg("נמשיך הלאה. המילה: "+w,"bad");speak(w)}
 const my=sid;setTimeout(()=>{if(my!=sid)return;i++;i<L.length?loadW():end()},1300)}
/* ---------- quizzes ---------- */
const pick=(l,u)=>u?l[0]:l[1],rnd=()=>Math.random()<.5;
function letters(){show(`<h1>🔤 האותיות</h1><div class="sm" dir="ltr">${LET.join(" ")}</div>`+B("🔊 שמעו ובחרו את האות","",()=>startQ(hearQ()))+B("A ← a &nbsp; מגדולה לקטנה","alt",()=>startQ(caseQ(true)))+B("a ← A &nbsp; מקטנה לגדולה","pu",()=>startQ(caseQ(false))))}
const hearQ=()=>sh(LET).map(c=>{const u=rnd(),a=pick(c,u),o=sh([a,...sh(LET.filter(x=>x!=c)).slice(0,3).map(x=>pick(x,rnd()))]);return{p:"🔊 איזו אות שמעתם?",s:"Letter "+c[0],lb:c,o,a:o.indexOf(a),g:0,cols:2,hint:"",auto:1}});
const caseQ=sm=>sh(LET).map(c=>{const a=pick(c,!sm),o=sh([a,...sh(LET.filter(x=>x!=c)).slice(0,3).map(x=>pick(x,!sm))]);return{p:pick(c,sm)+" → ?",s:"Letter "+c[0],lb:c,o,a:o.indexOf(a),g:1,cols:2,hint:sm?"מצאו את האות הקטנה":"מצאו את האות הגדולה",auto:0}});
const sentQ=()=>{const P=[n=>`This is a big ${n}.`,n=>`I like the ${n}.`,n=>`I have ${n=="egg"?"an":"a"} ${n}.`,n=>`Look at the ${n}!`];
 return sh(ITEMS).slice(0,10).map(([n,e],k)=>{const s=P[k%4](n),o=sh([e,...sh(ITEMS.filter(x=>x[0]!=n)).slice(0,2).map(x=>x[1])]);return{p:s,s,lb:s,o,a:o.indexOf(e),g:1,cols:3,hint:"",auto:1,e:1}})};
function startQ(q){Q=q;i=0;score=0;res=[];quiz=true;sid++;showQ()}
function showQ(){const q=Q[i],my=sid;fin=false;
 show(`<div class="sm" style="font-weight:700;font-size:18px">${i+1}/${Q.length} &nbsp; ⭐ ${score}</div><div class="sm">${q.hint}</div><div class="big" style="${q.g?'':'font-weight:700;font-size:24px;direction:rtl'}">${q.p}</div>`+B("🔊 שמעו שוב","mu",()=>speak(q.s))+
 `<div class="grid" style="grid-template-columns:repeat(${q.cols},1fr)" dir="ltr">`+q.o.map((t,k)=>`<button class="opt ${q.e?'e':''}" id="o${k}" onclick="ans(${k})">${t}</button>`).join("")+`</div><div class="msg" id="msg"></div>`);
 if(q.auto)speak(q.s)}
function ans(k){if(fin)return;fin=true;const q=Q[i],ok=k==q.a,my=sid;res.push([q.lb,"",ok]);$("#o"+q.a).className+=" gr";$("#o"+q.a).style.background="var(--ok)";
 if(ok){score++;msg("כל הכבוד! ✓","ok")}else{$("#o"+k).style.background="var(--bad)";msg("לא נכון, התשובה הנכונה בירוק","bad")}
 if(q.g||!ok)speak(q.s);setTimeout(()=>{if(my!=sid)return;i++;i<Q.length?showQ():end()},1600)}
/* ---------- end ---------- */
function end(){const n=quiz?Q.length:L.length,p=Math.round(score*100/n),wr=res.filter(r=>!r[2]);
 show(`<div class="card"><div style="font-size:28px;font-weight:800;color:var(--ok)">🎉 כל הכבוד אבישג! 🎉</div><div class="big">Well done, Avishag!</div><div class="stars">${p>=90?"⭐⭐⭐":p>=60?"⭐⭐":p>=30?"⭐":"💪"}</div><div class="score">${p}</div>
 <div>${score} מתוך ${n} נכונות – ${p>=90?"מצוין!":p>=60?"יפה מאוד, עוד קצת תרגול!":"המשיכו להתאמן!"}</div>
 <ul>${res.map(r=>`<li><span>${r[2]?"✅":"❌"} ${r[1]}</span><b dir="ltr">${r[0]}</b></li>`).join("")}</ul></div>`+
 (wr.length&&!quiz?B("תרגלו רק את הטעויות","alt",()=>words(sh(wr.map(r=>[r[0],r[1]])),silent)):"")+B("שחקו שוב","",menu));
 speak("Well done, Avishag!")}
welcome();
</script></body></html>

name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip -o Jet1Words.zip
      - run: cd Jet1Words && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Jet1Words/app/build/outputs/apk/debug/*.apk
